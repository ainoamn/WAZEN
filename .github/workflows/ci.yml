name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:backend
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run test:e2e
      - name: Build container
        run: docker build -t wazen:${{ github.sha }} .
      - name: Mark deploy-ready
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "CI green — safe for Vercel production deploy of ${{ github.sha }}"
          echo "Required checks (manual once):"
          echo "  1) GitHub → Settings → Branches → Protect main → Require status check 'verify'"
          echo "  2) Vercel → Project → Deployment Protection / only deploy when checks pass"
          echo "  3) Ensure CRON_SECRET + WAZEN_JOB_SECRET are set for /api/jobs/tick"
